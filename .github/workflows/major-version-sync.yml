name: Major Version Sync
run-name: Major Version Sync - ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  major-version-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        with:
          token: ${{ github.token }}
